# ZAP baseline rules for the invoices app: rule ID <tab> action <tab> reason or URL pattern.
# Rules not listed keep their default (WARN). Review these lines when the app changes.
# Cacheable content is fine on the public pages only. API responses send no-store
# (checked in tests/errors.test.js, because the baseline crawl does not reach /api).
10049	OUTOFSCOPE	^http://127\.0\.0\.1:3000/(hello\?.*|robots\.txt|sitemap\.xml)?$
# The app does not need cross-origin isolation.
90004	IGNORE	(Cross-Origin-Embedder-Policy Header Missing or Invalid)
